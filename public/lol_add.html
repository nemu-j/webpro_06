<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>チームを追加する</title>
</head>
<body>
    <form action="/lol_add">
        <label for="id">ID</label>
        <input type="number" name="id" id="id" required><br>

        <label for="team">チーム名</label>
        <input type="text" name="team" id="team" required><br>

        <label for="region">地域リーグ</label>
        <input type="text" name="region" id="region" required><br>

        <label for="code">略称</label>
        <input type="text" name="code" id="code" required><br>

        <label for="country">拠点</label>
        <input type="text" name="country" id="country" required><br>
        <input type="submit" value="登録">
    </form>
</body>
</html>
